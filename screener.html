<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TechnoFunda Desk Screener</title>
<script src="/prefs-sync.js"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f4fe0'/%3E%3Cpath d='M7 22l6-7 5 4 7-9' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css?v=20261008c">
<style>
body{overflow-x:hidden}
main.scr{max-width:none;margin:0;padding:0;display:block}
/* the filters open as a panel from the right, so the results get the whole width */
.side{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:70;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);box-shadow:-12px 0 38px rgba(0,0,0,.22);transform:translateX(105%);visibility:hidden;transition:transform .18s ease,visibility 0s .18s;min-height:0}
.side.open{transform:none;visibility:visible;transition:transform .18s ease}
.sback{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:65}
.sback[hidden]{display:none}
.sidehd{padding:18px 20px 10px;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:space-between}
.ftog{text-transform:none;letter-spacing:0;font-size:13px;padding:6px 14px}
#filters{flex:1;overflow-y:auto;min-height:0;padding:0 12px 8px}
.group{border:1px solid var(--line);border-radius:12px;margin:0 0 8px;background:var(--panel)}
.group[open]{box-shadow:0 1px 2px rgba(16,24,40,.04)}
.group summary{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;list-style:none;font-weight:500;user-select:none;border-radius:12px}
.group summary:hover{background:var(--soft)}
.group summary::-webkit-details-marker{display:none}
.group summary::after{content:'';width:7px;height:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(-45deg);transition:transform .12s;margin-left:8px}
.group[open] summary::after{transform:rotate(45deg)}
.group summary>span:first-of-type{flex:1}
.group .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:0 8px;font-size:12px;min-width:20px;text-align:center}
.group .note{margin:0 14px 8px}
.grid{display:block;padding:2px 14px 10px;border-top:1px solid var(--line)}
.f{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;padding:7px 0}
.f label{display:flex;align-items:center;gap:10px;cursor:pointer;flex:1 1 auto;color:var(--ink)}
.f input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);flex:none}
.f .ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:1 0 100%;padding-left:26px}
.f:not(.on) .ctl{display:none}
.f select,.f input[type=number],.minv input{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 10px}
.f input[type=number]{width:88px}
.f select{max-width:100%}
.help{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--line);color:var(--muted);font-size:11px;cursor:help}
.sbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 16px;border-top:1px solid var(--line);background:var(--panel)}
.minv{flex:1 0 100%;display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px}
.minv input{width:84px;text-align:right}
.go{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:9px 22px;font-weight:500}
.go:hover{filter:brightness(1.08)}.go:disabled{opacity:.6}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 16px;color:var(--ink)}
.pill:hover{border-color:var(--accent);color:var(--accent)}
.out{padding:14px 24px 40px;min-width:0}
.outhd{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 10px}
.out h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
.out .sub{margin:0;font-size:13px}
.outhd>div:first-child{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
#warn:empty{display:none}
#warn .warn{margin:0 0 10px;padding:6px 12px;font-size:13px}
.outhd>div:first-child{flex:1 1 300px}
.tablebox td.ind,.tablebox th[data-k=industry]{text-align:left}
.search{position:relative;flex:0 1 340px;min-width:220px}
.search input{width:100%;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:0 12px 0 36px}
.search svg{position:absolute;left:12px;top:10px;color:var(--muted)}
.chiprow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px}
.chiprow>.mut{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;min-width:92px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
.chiprow[hidden]{display:none}
.qbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 4px}
.grow{flex:1}
.crit{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:1 1 320px;min-width:0}
.crit>.mut{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;margin-right:2px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:3px 4px 3px 10px;font-size:13px}
.chip button{border:0;background:none;color:var(--muted);font-size:16px;line-height:1;cursor:pointer;padding:0 4px}
.chip button:hover{color:var(--down)}
.lnk{border:0;background:none;color:var(--accent);cursor:pointer;margin-left:auto;font-size:14px}
.inf{font-style:normal;color:var(--muted);font-size:11px;cursor:help}
.ctools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.ctools select,.ctools summary{height:36px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);padding:0 10px;font:inherit;font-size:14px;cursor:pointer}
.ctools details{position:relative}
.ctools summary{display:flex;align-items:center;gap:8px;list-style:none}
.ctools summary::-webkit-details-marker{display:none}
.ctools summary::after{content:'▾';font-size:11px;color:var(--muted)}
.ctools .qpop{top:calc(100% + 6px);min-width:190px}
.ctools .qn{background:var(--accent);color:#fff;border-radius:999px;padding:0 7px;font-size:11.5px}
.ctools .pill{padding:6px 12px}
.cgrid{display:grid;gap:14px}
.ccard{display:block;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:12px 14px;color:inherit;text-decoration:none;min-width:0}
.ccard:hover{border-color:var(--accent)}
.ccard canvas{width:100%;height:210px;display:block}
.chd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.chd .cn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.cb{border-radius:6px;padding:2px 8px;font-size:13px;font-weight:500}
.cb.up{color:var(--up);background:color-mix(in srgb,var(--up) 12%,var(--panel))}
.cb.down{color:var(--down);background:color-mix(in srgb,var(--down) 12%,var(--panel))}
@media (max-width:760px){.cgrid{grid-template-columns:minmax(0,1fr)!important}.crit .lnk{margin-left:0}}
.qf{position:relative}
.qbtn{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:14px;color:var(--ink);cursor:pointer}
.qbtn:hover,.qbtn[aria-expanded=true]{border-color:var(--accent)}
.qbtn.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel))}
.qbtn i{font-style:normal;font-size:11px;color:var(--muted)}
.qbtn .qn{background:var(--accent);color:#fff;border-radius:999px;padding:0 7px;font-size:11.5px}
.qpop{position:absolute;left:0;top:calc(100% + 6px);z-index:40;min-width:240px;max-width:min(360px,92vw);max-height:min(60vh,420px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 38px rgba(0,0,0,.25);padding:8px}
.qpop[hidden]{display:none}
.qpop input[type=search]{width:100%;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:0 10px;font:inherit;margin:0 0 6px;position:sticky;top:0}
.qpop label{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:14px}
.qpop label:hover{background:var(--soft)}
.qpop input[type=checkbox],.qpop input[type=radio]{accent-color:var(--accent);flex:none}
.qpop .qx{display:block;width:100%;text-align:left;border:0;background:none;color:var(--accent);padding:7px 8px;font-size:13px;cursor:pointer}
.qpop .none{padding:12px;color:var(--muted);font-size:13px;text-align:center}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 0 10px;scrollbar-width:none}
.tabs button{flex:none;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:8px 12px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tools .pill{padding:5px 12px;font-size:13px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 4px 0}
.pager .pg{display:flex;gap:4px;flex-wrap:wrap}
.pager .pg button{min-width:34px;height:34px;border:1px solid var(--line);background:var(--panel);border-radius:8px;color:var(--ink);cursor:pointer;padding:0 8px}
.pager .pg button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.pager .pg button[aria-current=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.pager .pg button:disabled{opacity:.45;cursor:default}
.pager select{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:0 8px}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;color:#fff;font-size:11.5px;font-weight:700;flex:none;letter-spacing:.02em}
.nmc{display:flex;align-items:center;gap:10px;min-width:0}
.nmc a{display:block;min-width:0;color:var(--ink);text-decoration:none}
.nmc b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:250px}
.nmc small{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.02em}
.colpop .gh{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:8px 0 2px}
.colpop{max-height:min(70vh,520px);overflow:auto;min-width:240px}
.colpop .qx{border:0;background:none;color:var(--accent);padding:8px 0 2px;cursor:pointer;font-size:13px}
.scanbar{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;margin:0 0 10px}
.scanwrap{position:relative;max-width:100%}
.scanbtn{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:14px;color:var(--ink);cursor:pointer;max-width:100%}
.scanbtn:hover,.scanbtn[aria-expanded=true]{border-color:var(--accent)}
.scanbtn .mut{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase}
.scanbtn b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:34ch}
.scanbtn .qn{background:var(--accent);color:#fff;border-radius:999px;padding:0 7px;font-size:11.5px}
.scanpop{position:absolute;left:0;top:calc(100% + 6px);z-index:40;width:min(560px,94vw);max-height:min(72vh,640px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 38px rgba(0,0,0,.25);padding:10px}
.scanpop[hidden]{display:none}
.scanpop input[type=search]{width:100%;height:36px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);padding:0 12px;font:inherit;margin:0 0 6px;position:sticky;top:0}
.sgrp{border-top:1px solid var(--line);padding:2px 0}
.sgrp:first-of-type{border-top:0}
.sgrp>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:8px 6px;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.sgrp>summary::-webkit-details-marker{display:none}
.sgrp>summary::before{content:'▸';font-size:11px;transition:transform .12s}
.sgrp[open]>summary::before{transform:rotate(90deg)}
.sgrp>summary .ct{margin-left:auto;font-weight:500;letter-spacing:0}
.si{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px}
.si:hover{background:var(--soft)}
.si.act{background:color-mix(in srgb,var(--accent) 11%,var(--panel));color:var(--accent)}
.si .nm{flex:1;min-width:0}
.si .n{color:var(--muted);font-size:12.5px}
.si .new{background:var(--accent);color:#fff;border-radius:999px;padding:0 7px;font-size:11.5px}
.si .x{border:0;background:none;color:var(--muted);font-size:17px;line-height:1;padding:0 4px;cursor:pointer}
.si .x:hover{color:var(--down)}
.scanpop .none{padding:14px;color:var(--muted);text-align:center;font-size:13px}
@media (max-width:760px){.scanwrap{width:100%}.scanbtn{width:100%;justify-content:space-between}.scanpop{width:100%}}
.sv{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--panel);overflow:hidden}
.sv button{border:0;background:none;padding:6px 12px;font-size:13px}
.sv button:hover{color:var(--accent)}
.sv .n{color:var(--muted);margin-left:6px}.sv .new{margin-left:6px;background:var(--accent);color:#fff;border-radius:999px;padding:0 7px;font-size:11.5px}
.sv.act{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--panel))}
.sv .x{padding:6px 10px;color:var(--muted);border-left:1px solid var(--line)}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:44px 24px;text-align:center;color:var(--muted);margin-top:14px}
.funnel{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:0}
.funnel .st{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px}
.funnel .st b{font-size:13px}
.funnel .st.last{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel))}
.funnel .ar{color:var(--muted)}
.result .head{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;margin-bottom:8px}
.result .head .hl{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap}
.result .head .r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;background:var(--soft);border:1px solid var(--line)}
.tag.up{color:var(--up);background:color-mix(in srgb,var(--up) 10%,var(--panel));border-color:color-mix(in srgb,var(--up) 25%,var(--line))}
.tag.down{color:var(--down);background:color-mix(in srgb,var(--down) 10%,var(--panel));border-color:color-mix(in srgb,var(--down) 25%,var(--line))}
.colmenu{position:relative}
.colpop{position:absolute;right:0;top:44px;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 34px rgba(16,24,40,.14);padding:10px 14px;min-width:210px}
.colpop[hidden]{display:none}
.colpop label{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer}
.tablebox{overflow-x:auto;overflow-y:hidden;padding:0;border-radius:14px}
.tablebox table{border-collapse:separate;border-spacing:0}
.tablebox .sn{display:inline-block;min-width:2.4em;margin-right:4px;text-align:right;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.tablebox thead th{top:0;z-index:2;padding:9px 12px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tablebox thead th[aria-sort]{color:var(--accent)}
.tablebox td{padding:0 12px;height:42px;border-bottom:1px solid var(--line)}
.tablebox tbody tr{border-bottom:0}
.tablebox tbody tr:last-child td{border-bottom:0}
.tablebox td:first-child,.tablebox th:first-child{position:sticky;left:0;background:var(--panel);z-index:1}
.tablebox tbody tr:hover td{background:var(--soft)}
.tablebox thead th:first-child{z-index:3}
.tablebox td.ind{max-width:230px;overflow:hidden;text-overflow:ellipsis}
@media (max-width:980px){
  .chips{flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding-bottom:6px}.chips button{flex:none;white-space:nowrap}
  .chiprow{flex-direction:column;align-items:flex-start;gap:6px}
  .chiprow>.mut{min-width:0}
  .chiprow>.chips{max-width:100%}
  .out{padding:18px 14px 50px}
  .tablebox{max-height:none}
}
@media (max-width:600px){
  .nmc b{max-width:150px}.av{display:none}
  .out{padding:10px 12px 40px}.outhd{margin-bottom:8px}.out .sub{display:none}.search{flex:1 1 100%}.search input{height:34px}.search svg{top:9px}
  #warn .warn{font-size:12px;padding:5px 10px;margin-bottom:8px}
  .scanbar .pill,.tools .pill{padding:4px 11px;font-size:12.5px}
  .qbar{gap:6px}.qbtn{padding:5px 10px;font-size:13px}
  .tabs button{padding:7px 10px;font-size:13.5px}
  .result .head .tools{gap:6px}
  .tablebox td,.tablebox thead th{padding-left:10px;padding-right:10px}
  .tablebox td{height:42px}
}
</style>
</head>

  for(const i of ids){const a=CH.type==='candle'?(b.l[i]??b.c[i]):b.c[i],z=CH.type==='candle'?(b.h[i]??b.c[i]):b.c[i];if(a<lo)lo=a;if(z>hi)hi=z}
  for(const [s] of ov)for(const i of ids)if(s[i]!=null){if(s[i]<lo)lo=s[i];if(s[i]>hi)hi=s[i]}
  const pad=(hi-lo)*0.06||hi*0.02;lo-=pad;hi+=pad;
  const X=k=>L+(k+0.5)/ids.length*pw,Y=v=>T+(hi-v)/(hi-lo)*hp;
  x.font='11px Inter,sans-serif';x.lineWidth=1;
  for(let g=0;g<=3;g++){const v=lo+(hi-lo)*g/3,y=Y(v);x.strokeStyle=LN;x.beginPath();x.moveTo(L,y);x.lineTo(L+pw,y);x.stroke();x.fillStyle=MUT;x.textAlign='left';x.fillText(nf0.format(v),L+pw+5,y+4)}
  const dt=i=>{const d=new Date(CD.d[i+(CD.d.length-n)]);return d.toLocaleDateString('en-IN',CH.range>=252?{month:'short',year:'2-digit'}:{day:'numeric',month:'short'})};
  x.fillStyle=MUT;x.textAlign='left';x.fillText(dt(ids[0]),L,h-5);x.textAlign='center';x.fillText(dt(ids[Math.floor(ids.length/2)]),L+pw/2,h-5);x.textAlign='right';x.fillText(dt(ids[ids.length-1]),L+pw,h-5);
  if(vol){let vm=0;for(const i of ids)if(b.v[i]>vm)vm=b.v[i];for(let k=0;k<ids.length;k++){const i=ids[k],v=b.v[i]||0,up=b.c[i]>=(b.o[i]??b.c[i]);x.fillStyle=(up?UP:DN)+'55';const bh=vm?v/vm*vh:0,bw=Math.max(1,pw/ids.length*0.7);x.fillRect(X(k)-bw/2,T+ph-bh,bw,bh)}}
  if(CH.type==='candle'){
    const bw=Math.max(1,Math.min(10,pw/ids.length*0.7));
    for(let k=0;k<ids.length;k++){const i=ids[k],o=b.o[i]??b.c[i],c=b.c[i],hh=b.h[i]??Math.max(o,c),ll=b.l[i]??Math.min(o,c),up=c>=o;x.strokeStyle=x.fillStyle=up?UP:DN;x.beginPath();x.moveTo(X(k),Y(hh));x.lineTo(X(k),Y(ll));x.stroke();const y1=Y(Math.max(o,c)),y2=Y(Math.min(o,c));x.fillRect(X(k)-bw/2,y1,bw,Math.max(1,y2-y1))}
  }else{
    const col=ret>=0?UP:DN;x.beginPath();ids.forEach((i,k)=>{k?x.lineTo(X(k),Y(b.c[i])):x.moveTo(X(k),Y(b.c[i]))});
    if(CH.type==='area'){const g=x.createLinearGradient(0,T,0,T+hp);g.addColorStop(0,col+'44');g.addColorStop(1,col+'00');x.save();x.lineTo(X(ids.length-1),T+hp);x.lineTo(X(0),T+hp);x.closePath();x.fillStyle=g;x.fill();x.restore();x.beginPath();ids.forEach((i,k)=>{k?x.lineTo(X(k),Y(b.c[i])):x.moveTo(X(k),Y(b.c[i]))})}
    x.strokeStyle=col;x.lineWidth=1.6;x.stroke();x.lineWidth=1;
  }
  for(const [s,c] of ov){x.strokeStyle=c;x.lineWidth=1.3;x.beginPath();let st=false;ids.forEach((i,k)=>{if(s[i]==null){return}st?x.lineTo(X(k),Y(s[i])):x.moveTo(X(k),Y(s[i]));st=true});x.stroke()}
  x.lineWidth=1;
}
let rsz=null;window.addEventListener('resize',()=>{clearTimeout(rsz);rsz=setTimeout(()=>{if(tab==='chart')paintAll()},120)});
$('#theme').addEventListener('click',()=>setTimeout(()=>{if(tab==='chart')paintAll()},80));
document.addEventListener('change',e=>{
  const t=e.target;if(!t.closest('#ctools'))return;
  if(t.id==='chType')CH.type=t.value;
  else if(t.id==='chRange')CH.range=+t.value;

  else if(t.id==='chSort'){sort={k:t.value,d:t.value==='name'?1:-1};try{localStorage.setItem('setupdesk.scrsort',JSON.stringify(sort))}catch(_){}page=1}
  else if(t.dataset.ci){const k=t.dataset.ci;CH.ind=t.checked?[...CH.ind,k]:CH.ind.filter(x=>x!==k);indOpen=true}

document.addEventListener('click',e=>{
  if(e.target.closest('#chDir')){sort={k:sortNow().k,d:-sortNow().d};try{localStorage.setItem('setupdesk.scrsort',JSON.stringify(sort))}catch(_){}page=1;draw();return}

/* ---- the filters of the current scan, as chips above the table ---- */
function critText(f,v){
  const u=f.unit?' '+f.unit:'';
  if(f.type==='flag')return f.label;
  if(f.type==='range')return `${f.label}: ${v[0]}–${v[1]}`;
  if(f.type==='choice')return `${f.label}: ${(f.options&&f.options[v])||v}`;
  if(f.type==='count')return `${f.label}: ${v} of ${f.of}`;
  if(f.type==='direction')return `${f.label}: ${v}`;
  return /[<>]=?\s*$/.test(f.label)?`${f.label} ${v}${u}`:`${f.label}: ${v}${u}`;
}
function renderCrit(){
  const F=collect(),mv=Number($('#minval').value)||0,items=[];
  for(const [id,v] of Object.entries(F)){const f=FIELDS.find(x=>x.id===id);if(f)items.push([id,critText(f,v)])}
  if(mv)items.push(['_minval','Average traded value ≥ ₹'+nf0.format(mv)+' Cr']);
  $('#crit').innerHTML=(items.length?`<span class="mut">Filters</span>${items.map(([id,t])=>`<span class="chip">${esc(t)}<button type="button" data-x="${id}" aria-label="Remove this filter" title="Remove this filter">×</button></span>`).join('')}`:'<span class="mut">No filters: every liquid NSE stock.</span>')+`<button type="button" class="lnk" id="critEdit">${items.length?'Edit':'Add filters'}</button>`;
}
$('#crit').addEventListener('click',e=>{
  const x=e.target.closest('[data-x]');
  if(x){const id=x.dataset.x;if(id==='_minval')$('#minval').value=0;else{const box=document.querySelector(`.f[data-f="${id}"]`);if(box){box.querySelector('[data-on]').checked=false;box.classList.remove('on')}}counts();run();return}
  if(e.target.closest('#critEdit')){setFilters(true);counts(true);const sd=document.querySelector('.side');const g=sd.querySelector('.group[open]')||sd.querySelector('.group');if(g)g.open=true}
});
$('#newScan').onclick=()=>{$('#clear').click();setFilters(true)};
$('#saveTop').onclick=()=>$('#save').click();
/* saved screens: keep a set of filters under a name; the nightly run records who matched, so each chip shows what is new */
const PGROUP={'Daily movers':['Movers and Shakers: up 3%+ today on real volume','Weekly movers: up 8%+ this week on real volume'],'Growth and quality':['Strong results in an uptrend','Early turnarounds, price confirming','Quality at a fair price, trending','Accelerating earnings + RS leaders'],
  'Bases and breakouts':['Tight bases in leaders','VCP setups in leaders','Fresh breakouts from a base'],
  'Techno Funda scans':['Super growth scan','Techno Funda'],
  'Swing playbook':['Earnings scan: profit +25%, Rs 1,000-10,000 Cr','EPS scan, small: Rs 500-10,000 Cr','EPS scan, medium: Rs 10,000-20,000 Cr','EPS scan, large: Rs 20,000 Cr and above','RS scan: RS 80+, within 20% of the high','IPO scan: listed within a year','Swing entry: near highs, tight, volume spike']};
let PACT=(()=>{try{return localStorage.getItem('setupdesk.scrpreset')||''}catch(e){return ''}})();     // the preset last applied (its name), shown on the Scan button
async function loadSaved(){
  try{SAVED=await (await fetch('/api/screens')).json()}catch(e){SAVED=[]}
  renderScans();
}
function scanLabel(){
  const sv=LAST&&SAVED.find(v=>String(v.id)===LAST);
  if(sv)return sv.name;
  if(PACT&&PRESETS.some(p=>p.name===PACT))return PACT;
  return 'Choose a scan';
}
function renderScans(){
  const q=($('#scanQ').value||'').trim().toLowerCase(),hit=n=>!q||n.toLowerCase().includes(q);
  const sv=SAVED.filter(s=>hit(s.name)),act=scanLabel();
  const row=(attrs,name,extra,on)=>`<div class="si${on?' act':''}" ${attrs}><span class="nm">${esc(name)}</span>${extra}</div>`;
  let h='';
  if(SAVED.length)h+=`<details class="sgrp" open><summary>My screens<span class="ct">${sv.length}${q?' of '+SAVED.length:''}</span></summary>${sv.map(s=>row(`data-open="${s.id}" title="Open this screen${s.new_since?` (compared with ${esc(s.new_since)})`:''}"`,s.name,`<span class="n">${s.count}</span>${s.new.length?`<span class="new">+${s.new.length} new</span>`:''}<button class="x" data-del="${s.id}" title="Delete this saved screen" aria-label="Delete ${esc(s.name)}">×</button>`,String(s.id)===LAST)).join('')||'<div class="none">No saved screen matches.</div>'}</details>`;
  for(const [g,names] of Object.entries(PGROUP)){
    const items=names.map(n=>[n,PRESETS.findIndex(p=>p.name===n)]).filter(([n,i])=>i>=0&&hit(n));
    if(!items.length)continue;
    const open=q||items.some(([n])=>n===act&&!LAST)||(!SAVED.length&&g==='Techno Funda scans');
    h+=`<details class="sgrp"${open?' open':''}><summary>${esc(g)}<span class="ct">${items.length}</span></summary>${items.map(([n,i])=>row(`data-p="${i}"`,n,'',!LAST&&n===act)).join('')}</details>`;
  }
  $('#scanList').innerHTML=h||'<div class="none">Nothing matches.</div>';
  $('#scanName').textContent=scanLabel();
  const nw=SAVED.reduce((a,s)=>a+s.new.length,0);
  const bd=$('#scanBadge');bd.hidden=!nw;bd.textContent=nw+' new';$('#scanBtn').title=nw?`${nw} new match${nw>1?'es':''} in your saved screens`:'';
}
const closeScans=()=>{$('#scanPop').hidden=true;$('#scanBtn').setAttribute('aria-expanded','false')};
$('#scanBtn').onclick=()=>{const p=$('#scanPop');p.hidden=!p.hidden;$('#scanBtn').setAttribute('aria-expanded',String(!p.hidden));if(!p.hidden){renderScans();$('#scanQ').focus()}};
$('#scanQ').oninput=renderScans;
document.addEventListener('click',e=>{if(!e.target.closest('#scanWrap'))closeScans()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeScans()});
async function openSaved(id){
  const s=SAVED.find(v=>v.id==id);if(!s)return;
  try{localStorage.setItem('setupdesk.scrlast',String(s.id))}catch(_){}LAST=String(s.id);PACT='';
  try{const r=await fetch('/api/screens/'+s.id+'/refresh',{method:'POST'});if(r.ok){const f=await r.json();Object.assign(s,f)}}catch(_){}
  $('#minval').value=s.min_value_cr||0;pendingNew=new Set(s.new);applyPreset(s.filters);loadSaved();
}
function usePreset(i){
  LAST='';try{localStorage.removeItem('setupdesk.scrlast');localStorage.setItem('setupdesk.scrpreset',PRESETS[i].name)}catch(_){}PACT=PRESETS[i].name;
  $('#minval').value=0;                                    // a preset sets no liquidity floor of its own: do not keep the one from a screen opened before
  applyPreset(PRESETS[i].set);renderScans();
}
$('#scanList').onclick=async e=>{
  const x=e.target.closest('[data-del]'),o=e.target.closest('[data-open]'),pr=e.target.closest('[data-p]');
  if(x){e.stopPropagation();const s=SAVED.find(v=>v.id==x.dataset.del);if(s&&confirm('Delete the saved screen "'+s.name+'"?')){await fetch('/api/screens/'+s.id,{method:'DELETE'});if(LAST===String(s.id))LAST='';loadSaved()}return}
  if(o){closeScans();openSaved(o.dataset.open);return}
  if(pr){closeScans();usePreset(+pr.dataset.p)}
};
$('#save').onclick=async()=>{
  const filters=collect();if(!Object.keys(filters).length){alert('Tick at least one filter first.');return}
  const name=prompt('Name for this screen');if(!name||!name.trim())return;
  const r=await fetch('/api/screens',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,filters,min_value_cr:Number($('#minval').value)||0})});
  if(!r.ok){alert('Could not save: '+((await r.json()).detail||r.status));return}
  loadSaved();
};
function clearFilters(){try{localStorage.removeItem(FKEY)}catch(e){}document.querySelectorAll('#filters [data-on]').forEach(c=>{c.checked=false;c.closest('.f').classList.remove('on')});document.querySelectorAll('#filters [data-k]').forEach(i=>{if(i.tagName==='INPUT')i.value='';else if(i.querySelector('option[value=""]'))i.value=''});counts()}
$('#clear').onclick=()=>{clearFilters();LAST='';PACT='';try{localStorage.removeItem('setupdesk.scrlast');localStorage.removeItem('setupdesk.scrpreset')}catch(_){}renderScans();run()};
(async()=>{
  FIELDS=await (await fetch('/api/screener/fields')).json();build();
  loadSaved();
  $('#filters').addEventListener('change',()=>setTimeout(saveFilters,0));$('#filters').addEventListener('input',()=>setTimeout(saveFilters,0));$('#minval').addEventListener('change',saveFilters);
  {const pi=new URLSearchParams(location.search).get('preset');
   if(pi!=null&&PRESETS[+pi]){PACT=PRESETS[+pi].name;LAST='';applyPreset(PRESETS[+pi].set);renderScans()}
   else{try{const o=JSON.parse(localStorage.getItem(FKEY)||'null');
     if(o&&(Object.keys(o.filters||{}).length||o.minval)){if(Number.isFinite(o.minval))$('#minval').value=o.minval;if(Object.keys(o.filters||{}).length)applyPreset(o.filters);else run()}else run()}catch(e){run()}}}
  try{const c=await (await fetch('/api/screener/coverage')).json();
    document.querySelector('.f[data-f="grade"]').closest('.group').querySelector('summary').insertAdjacentHTML('afterend',`<p class="note">Quarterly results are checked for <b>${c.fundamentals}</b> of ${nf0.format(c.technical)} stocks, so turning on any filter below limits the search to those ${c.fundamentals}. ${c.stale?`${c.stale} more have only older results and are left out.`:''}</p>`)}catch(e){}
  try{const b=await (await fetch('/api/breadth')).json();$('#sub').textContent=`Every NSE stock · data to ${b.dates[b.dates.length-1]}`}catch(e){$('#sub').textContent='Price-based filters across every NSE stock'}
})();

fetch('/api/status').then(r=>r.json()).then(s=>{
  if(s.never_run)return;
  const m=[...(s.warnings||[])];
  if(s.exit_code===2)m.unshift('The last nightly refresh failed, so this is data from an earlier run.');
  if(s.age_hours>60)m.unshift('The last refresh finished '+Math.round(s.age_hours/24)+' days ago.');
  if(m.length)document.querySelector('#warn').insertAdjacentHTML('beforeend','<div class="warn"><b>Data check:</b> '+m.map(x=>String(x).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))).join(' &middot; ')+'</div>');
}).catch(()=>{});
</script>
