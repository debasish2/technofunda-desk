<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TechnoFunda Desk</title>
<script src="/prefs-sync.js"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f4fe0'/%3E%3Cpath d='M7 22l6-7 5 4 7-9' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f3f6;--panel:#ffffff;--ink:#12161d;--muted:#667085;--line:#e1e4ea;--soft:#f6f7f9;
  --accent:#2f4fe0;--up:#0b9a62;--down:#d3323d;--amber:#c97b08;--ema50:#5a5ce0;--ema200:#a3202a;--grid:#e7eaf0;
  --c-bb:#0b8a5f;--c-good:#2f9e44;--c-ok:#c97b08;--c-turn:#7a4fd6;--c-trash:#d3323d;
  --bup:#2a2ad8;--bdown:#e83ee8;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1015;--panel:#151a21;--ink:#e7eaf0;--muted:#8d96a5;--line:#252b35;--soft:#1a2029;
    --accent:#7088ff;--up:#2bc48a;--down:#f06670;--amber:#e2a13a;--ema50:#8d8fff;--ema200:#e0525c;--grid:#222a35;
    --c-bb:#2bc48a;--c-good:#6fcf7f;--c-ok:#e2a13a;--c-turn:#a98bf5;--c-trash:#f06670;
    --bup:#6f7dff;--bdown:#f065f0;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1015;--panel:#151a21;--ink:#e7eaf0;--muted:#8d96a5;--line:#252b35;--soft:#1a2029;
  --accent:#7088ff;--up:#2bc48a;--down:#f06670;--amber:#e2a13a;--ema50:#8d8fff;--ema200:#e0525c;--grid:#222a35;
  --c-bb:#2bc48a;--c-good:#6fcf7f;--c-ok:#e2a13a;--c-turn:#a98bf5;--c-trash:#f06670;
  --bup:#6f7dff;--bdown:#f065f0;
}
/* light, easy-to-see scrollbars */
:root{--sb:#b9c0cd;--sbt:#eceef2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sb:#a3acbd;--sbt:#262c37}}
:root[data-theme="dark"]{--sb:#a3acbd;--sbt:#262c37}
*{scrollbar-color:var(--sb) var(--sbt)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13.5px/1.45 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.up{color:var(--up)}.down{color:var(--down)}.mut{color:var(--muted)}

.app{--rail:60px;--wl:320px;--wr:520px;position:relative;height:100%;display:grid;grid-template-columns:var(--rail) var(--wl) minmax(0,1fr) var(--wr);grid-template-rows:minmax(0,1fr);grid-template-areas:"top list center right"}
.top{grid-area:top;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0;background:var(--panel);border-right:1px solid var(--line);position:relative;z-index:20;overflow:hidden}
.top .grow{flex:1}
.top .sep{width:28px;border-top:1px solid var(--line);margin:6px 0}
.top .demo{margin:0 0 6px;padding:1px 7px;font-size:10.5px}
.rb{display:flex;flex-direction:column;align-items:center;gap:3px;width:52px;padding:7px 0;border:0;background:none;border-radius:9px;color:var(--muted);text-decoration:none;font-size:10.5px;line-height:1.1;cursor:pointer}
.rb:hover{background:var(--soft);color:var(--ink)}
.rb[aria-pressed=true]{color:var(--accent)}
.rb[aria-pressed=false]{opacity:.55}
.ghost{background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:6px 11px;color:var(--muted)}
.ghost:hover{color:var(--ink)}
.icon{display:none}
.search{position:relative;margin-bottom:8px}
.search input{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--soft);outline:none}
.search input:focus{border-color:var(--accent);background:var(--panel)}
.results{position:absolute;z-index:40;left:0;right:0;top:40px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.14);max-height:320px;overflow:auto}
.results button{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;background:none;padding:8px 12px;text-align:left}
.results button:hover,.results button[aria-selected=true]{background:var(--soft)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;background:var(--soft);border:1px solid var(--line);color:var(--muted)}
.demo{margin-left:auto}

.list{grid-area:list;display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
.listhead{padding:12px}
.lrow{display:flex;gap:6px}
.sq{width:34px;height:34px;display:grid;place-items:center;padding:0;flex:none}
.listhead select{flex:1;min-width:0;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 8px}
.cols,.row{display:grid;grid-template-columns:minmax(0,1.35fr) .9fr .9fr .9fr;gap:4px;padding:0 12px;align-items:center}
.cols{border-bottom:1px solid var(--line);padding-bottom:6px}
.cols button{border:0;background:none;color:var(--muted);text-align:right;padding:2px 0}
.cols button:first-child{text-align:left}
.cols button[data-on]{color:var(--ink);font-weight:600}
.rows{flex:1;overflow:auto;min-height:0}
.row{height:38px;width:100%;border:0;border-left:3px solid transparent;background:none;text-align:right}
.row:hover{background:var(--soft)}
.row.on{background:var(--soft);border-left-color:var(--accent)}
.row .s{text-align:left;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.on .s{color:var(--accent)}
.listfoot{display:flex;justify-content:space-between;padding:8px 12px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}

.center{grid-area:center;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel);overflow-y:auto}
.stockhead{display:flex;justify-content:space-between;align-items:center;gap:2px 16px;padding:6px 14px;flex-wrap:wrap}
.stockhead h1{margin:0;font-size:19px;font-weight:600;display:inline}
.shl,.shr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.shr .pxmeta{margin-left:4px}
.tone{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12.5px;text-decoration:none;border:1px solid var(--line);color:var(--ink);background:var(--soft)}
.tone[hidden]{display:none}.tone i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.tone.g i{background:var(--up)}.tone.r i{background:var(--down)}.tone.w i{background:var(--down)}.tone.w{color:var(--down)}
.tone.g{background:color-mix(in srgb,var(--up) 12%,transparent)}.tone.r{background:color-mix(in srgb,var(--down) 12%,transparent)}
.top [hidden]{display:none!important}
#listHide{display:none}   /* the list has one hide control (the ☰ above the search box) and one show control (▸ in the stock header); search is the box itself, or the / key */
#openList{display:none;padding:4px 8px}.app.nolist #openList{display:inline-flex}
.stockhead .sub{color:var(--muted)}
.wl{margin-left:2px;border:0;background:none;color:var(--muted)}
.wl[aria-pressed=true]{color:var(--amber)}
.px{font-size:22px;font-weight:600}
.pxmeta{color:var(--muted);margin-left:14px}
.chartwrap{flex:1 0 440px;min-height:440px;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.chartwrap.fs{position:fixed;inset:0;z-index:60;background:var(--panel);min-height:0!important;max-height:none!important;height:100vh!important;height:100dvh!important;width:100%;flex:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}
body.fsOn{overflow:hidden}
.ctl{display:flex;gap:6px;padding:6px 10px 0;flex-wrap:wrap;align-items:center}
.ctl.two{padding-bottom:6px}
.ctl .grow{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 9px;color:var(--muted)}
.dd{position:relative}
.ddb{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:4px 9px;color:var(--ink)}
.ddb i,#indBtn i{font-style:normal;font-size:10px;color:var(--muted)}
.ddb svg{display:block}
.ddm{position:absolute;left:0;top:calc(100% + 4px);z-index:25;min-width:150px;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.16);padding:4px}
.seg.ddm{display:flex;flex-direction:column;overflow:visible}.seg.ddm[hidden]{display:none}
.ddm button{display:flex;align-items:center;gap:8px;text-align:left;padding:6px 10px;border-radius:6px;background:none;color:var(--ink)}
.ddm button:hover:not(:disabled){background:var(--soft)}
.seg.ddm button[aria-pressed=true]{background:var(--soft);color:var(--accent)}
.cnt{display:inline-block;min-width:16px;padding:0 5px;border-radius:999px;background:var(--accent);color:#fff;font-size:11px;font-weight:600;text-align:center}
.cnt:empty{display:none}
#logBtn[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
#patN:not(:empty){color:var(--accent)}
.pop .row{display:flex;width:100%;justify-content:space-between;align-items:center;border:0;background:none;padding:6px 0;color:var(--ink);text-align:left}
.pop .row[aria-pressed=true]::after{content:'✓';color:var(--accent);font-weight:600}
.pop select{margin-left:6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:2px 4px}
.chartwrap{container-type:inline-size}
@container (max-width:760px){.lbx{display:none}}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.tg{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:4px 10px;color:var(--muted)}
.tg[aria-pressed=true]{color:var(--ink);border-color:var(--accent);background:var(--soft)}
.chartrow{position:relative;flex:1;min-height:0;display:flex}
.tools{width:46px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;border-right:1px solid var(--line)}
.tools button{width:34px;height:34px;border:0;border-radius:7px;background:none;color:var(--muted);display:grid;place-items:center}
.tgw{position:relative;display:flex;flex:none}
.tools .fl{position:absolute;right:-5px;bottom:1px;width:12px;height:16px;font-size:8px;padding:0;border-radius:3px;background:none;color:var(--muted)}
.tools .fl:hover{background:var(--soft);color:var(--ink)}
.tools button[aria-pressed=true]{background:var(--soft);color:var(--accent)}
.tools button:hover{color:var(--ink)}
.tools{overflow-y:auto;gap:3px;scrollbar-width:none}.tools::-webkit-scrollbar{display:none}.tools button{flex:none;width:32px;height:32px}
.tools hr{width:22px;border:0;border-top:1px solid var(--line);margin:3px 0;flex:none}
.tools button:disabled{opacity:.3;cursor:default}
.tools .slash{display:none}.tools [data-act=hide][aria-pressed=true] .slash{display:inline}
.tools.locked [data-tool]:not([data-tool=cursor]),.tools.locked .fl{opacity:.3;pointer-events:none}
.flyout{position:absolute;left:50px;z-index:35;min-width:230px;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:4px}
.flyout[hidden]{display:none}
.flyout button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:6px 10px;border-radius:6px;color:var(--ink);text-align:left;cursor:pointer}
.flyout button:hover{background:var(--soft)}
.flyout button[aria-pressed=true]{color:var(--accent)}
.flyout svg{flex:none;color:var(--muted)}
.flyout .fh{padding:8px 10px 3px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.flyout .fh:not(:first-child){border-top:1px solid var(--line);margin-top:4px}
.flyout kbd{margin-left:auto;font:inherit;font-size:11.5px;color:var(--muted)}
.flyout{max-height:calc(100% - 8px);overflow-y:auto}
.objpop{top:8px;min-width:290px;max-width:340px;padding:6px}
.objpop .oh{padding:4px 6px 8px;font-weight:500}
.orow{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:7px;cursor:pointer}
.orow:hover,.orow.sel{background:var(--soft)}.orow.off{opacity:.5}
.orow .oi{color:var(--muted);flex:none;display:grid}.orow .on{flex:1;min-width:0;display:flex;flex-direction:column}
.orow .on small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow button{width:24px;min-width:24px;height:24px;color:var(--muted)}
.ctxm{position:fixed;z-index:90;min-width:230px;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:0 12px 34px rgba(0,0,0,.22);padding:4px}
.ctxm[hidden]{display:none}
.ctxm button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 12px;border-radius:6px;color:var(--ink);cursor:pointer}
.ctxm button:hover:not(:disabled){background:var(--soft)}.ctxm button:disabled{opacity:.4;cursor:default}
.ctxm hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.seltb{position:absolute;left:50%;top:6px;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:0 6px 20px rgba(0,0,0,.16);padding:4px 6px}
.seltb[hidden]{display:none}
.seltb button{border:0;background:none;cursor:pointer;color:var(--muted);border-radius:6px;min-width:24px;height:24px;display:grid;place-items:center;padding:0 4px}
.seltb .sw{width:16px;min-width:16px;height:16px;border-radius:50%;border:2px solid transparent}.seltb .sw.on{border-color:var(--ink)}
.seltb .wd i{display:block;width:16px;background:currentColor;border-radius:2px}
.seltb .on:not(.sw){background:var(--soft);color:var(--accent)}
.seltb .sp{width:1px;height:16px;background:var(--line);margin:0 3px}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:34px;z-index:4;background:var(--ink);color:var(--panel);padding:3px 10px;border-radius:999px;font-size:12px;pointer-events:none}
.cvwrap{position:relative;flex:1;min-width:0;min-height:0}
#cv{position:absolute;inset:0;touch-action:pan-y;cursor:crosshair}
#tvwrap{position:absolute;inset:0}
#idwrap{position:absolute;inset:0;background:var(--panel);z-index:6}
.idmsg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);padding:20px;text-align:center;font-size:13px}
.idleg{position:absolute;left:10px;top:8px;z-index:7;font-size:12px;pointer-events:none;line-height:1.5}
#legend{z-index:3;position:absolute;left:12px;top:6px;pointer-events:none;font-size:12.5px;line-height:1.55;text-shadow:0 0 3px var(--panel),0 0 3px var(--panel),0 0 2px var(--panel);padding:1px 4px}
.tablepane{max-height:190px;overflow:auto;border-top:1px solid var(--line)}
.tablepane table{width:100%}
.asm{color:var(--amber);font-size:12px}
.chip.asm{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 40%,var(--line));background:color-mix(in srgb,var(--amber) 12%,transparent);margin-left:8px;font-size:12px;vertical-align:middle}
.chip.fh{border-color:transparent}
.chip.fh.down{color:var(--down);background:color-mix(in srgb,var(--down) 12%,transparent)}
.chip.fh.up{color:var(--up);background:color-mix(in srgb,var(--up) 12%,transparent)}
.qstats{border-top:1px solid var(--line);background:var(--panel);overflow-x:auto}
.qgrid{display:grid;align-items:stretch;font-size:12.5px;min-width:720px}
.qgrid>*{padding:5px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.qt{border:0;background:none;text-align:left;font-weight:600;color:var(--ink)}
.ql{color:var(--muted);text-align:left;font-weight:500}.ql.cur{color:var(--ink);font-weight:600}
.qh{color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:6px}.qh b{color:var(--ink);font-weight:500}
.qh .yq{display:flex;flex-direction:column;font-size:10.5px;line-height:1.25;text-align:right}.qh .yq i{font-style:normal}
.qc{display:flex;justify-content:space-between;gap:6px;align-items:center}
.qc .v{font-weight:500}
.qc .d{display:flex;flex-direction:column;font-size:11px;line-height:1.25;text-align:right;color:var(--muted)}
.qc .d i{font-style:normal}
.app.nolist{--wl:0px}.app.nolist .list,.app.nolist #rzL{display:none}
.app.noright{--wr:0px}.app.noright .right,.app.noright #rzR{display:none}
.rz{position:absolute;top:0;bottom:0;width:9px;z-index:30;cursor:col-resize;touch-action:none}
.rz::after{content:'';position:absolute;top:0;bottom:0;left:4px;width:2px;background:var(--accent);opacity:0;transition:opacity .12s}
.rz:hover::after,body.rzing .rz::after{opacity:.55}
#rzL{left:calc(var(--rail) + var(--wl) - 4px)}#rzR{right:calc(var(--wr) - 4px)}
body.rzing{user-select:none;cursor:col-resize}
.vt[aria-pressed=false]{opacity:.55}
.statbar{display:flex;gap:6px 16px;flex-wrap:wrap;padding:6px 14px;border-top:1px solid var(--line);color:var(--muted)}
.statbar b{font-weight:600}
.statbar .r{margin-left:auto}
.popwrap{position:relative}
.pop{position:absolute;right:0;top:34px;z-index:15;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 14px;min-width:170px;box-shadow:0 10px 30px rgba(0,0,0,.14)}
.pop label{display:flex;gap:8px;align-items:center;padding:4px 0}
.ir{pointer-events:auto;display:flex;align-items:center;gap:6px;color:var(--muted);width:max-content;max-width:90%}
.ir.off{opacity:.5}
.ir .ia{display:none;gap:2px}.ir:hover .ia{display:inline-flex}
.ir .ia button{border:0;background:none;color:var(--muted);padding:0 4px;font-size:12px;cursor:pointer;line-height:1.2}
.ir .ia button:hover{color:var(--ink)}
#pills{position:absolute;right:76px;bottom:26px;z-index:3;display:flex;gap:4px;pointer-events:none;font-size:11.5px;font-weight:600}
#pills span{padding:2px 8px;border-radius:4px;color:#fff}
.indpop{width:370px;max-height:70vh;overflow:auto}
.indpop .ih{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:6px 0 4px}
.indrow{display:flex;align-items:center;gap:7px;padding:4px 0;border-bottom:1px solid var(--line)}
.indrow .nm{font-weight:500;flex:1;min-width:0;white-space:nowrap}
.indrow input[type=number]{width:54px;padding:2px 4px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);font:inherit}
.indrow .sw{width:14px;height:14px;border-radius:50%;border:0;padding:0;cursor:pointer;flex:none}
.indrow .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;padding:0 2px}
.indrow.off .nm{opacity:.45}
.indadd{display:flex;flex-wrap:wrap;gap:6px}
.indadd button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 9px;color:var(--ink);cursor:pointer}
.indadd button:hover{border-color:var(--accent);color:var(--accent)}
.indnote{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.4}

.right{grid-area:right;overflow:auto;background:var(--bg);border-left:1px solid var(--line);min-height:0}
.tabs{display:flex;position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);z-index:5;overflow-x:auto}
.tabs button{border:0;background:none;padding:14px 15px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
#panel{padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 14px}
.card h4{margin:0 0 8px;font-size:13px;font-weight:600}
.card ul{margin:0;padding-left:18px}
.card li{margin:3px 0}

<script>
(()=>{
'use strict';

    document.body.insertAdjacentHTML('afterbegin','<div style="position:fixed;z-index:999;left:0;right:0;top:0;padding:12px 18px;background:#b4232c;color:#fff;font:14px system-ui">The TechnoFunda Desk server is not running, so the Screener, Breadth and your real data are unavailable. Double-click <b>start-desk.bat</b> in the project folder; it starts the server and opens this page.</div>')});

const store={get(){try{return JSON.parse(localStorage.getItem('setupdesk.v1')||'{}')}catch(e){return {}}},set(o){try{localStorage.setItem('setupdesk.v1',JSON.stringify(o))}catch(e){}}};

/* ---------- sample data ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function gauss(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const addDays=(iso,k)=>new Date(Date.parse(iso+'T00:00:00Z')+k*864e5).toISOString().slice(0,10);
function bizDates(n,end){const out=[];let d=new Date(end+'T00:00:00Z');while(out.length<n){const w=d.getUTCDay();if(w&&w<6)out.push(d.toISOString().slice(0,10));d=new Date(d.getTime()-864e5)}return out.reverse()}
const N=900, END='2026-10-05', DATES=bizDates(N,END);
const qEnd=i=>{const mi=2023*12+8+3*i;return new Date(Date.UTC(Math.floor(mi/12),mi%12+1,0)).toISOString().slice(0,10)};
const qLabel=end=>{const d=new Date(end+'T00:00:00Z'),m=d.getUTCMonth(),y=d.getUTCFullYear();return 'Q'+(Math.floor(((m-3+12)%12)/3)+1)+' FY'+String(m>=3?y+1:y).slice(2)};
const monYr=end=>{const d=new Date(end+'T00:00:00Z');return MON[d.getUTCMonth()]+' '+d.getUTCFullYear()};

const UNI=[
['Telecom - Equipment & Accessories',[['VANOPT','Vantage Optics','rocket'],['KESTEL','Kestrel Telecom','steady'],['ORBCAB','Orbitel Cables','choppy'],['SIGWAV','Signalwave Systems','turn'],['FIBCOR','Fibrecore India','basing'],['TESNET','Tessera Networks','steady'],['NIMANT','Nimbus Antennas','decline']]],
['Auto Components',[['TQFORG','Torque Forge','steady'],['AXLROD','Axlerod Industries','rocket'],['CAMDYN','Camshaft Dynamics','choppy'],['BRKWEL','Brakewell Auto','steady'],['GEARHD','Gearhead Mobility','turn'],['PISTON','Piston & Co','decline'],['CHSCRF','Chassis Craft','basing']]],
['Capital Goods',[['IRNCLD','Ironclad Engineering','steady'],['TRBMAX','Turbomax Machines','rocket'],['HYDVLT','Hydrovolt Equipments','choppy'],['CRSTLN','Crestline Heavy','basing'],['PNCBOL','Pinnacle Boilers','steady'],['GRDLIN','Gridline Electricals','turn'],['FRGMST','Forgemaster Tools','decline']]],
['Specialty Chemicals',[['AROMCH','Aromatica Chem','steady'],['POLYPH','Polyphase Materials','rocket'],['CATLYX','Catalyx Labs','choppy'],['RESNVA','Resinova','basing'],['FLUORS','Fluorite Speciality','steady'],['PIGMNT','Pigmento India','turn'],['SOLVEX','Solvex Industries','decline']]],
['Pharmaceuticals',[['MEDVAN','Medivane Labs','steady'],['CURLEF','Cureleaf Pharma','choppy'],['GENMIX','Genomix Biotech','rocket'],['APOTHN','Apothecon','basing'],['VITLIS','Vitalis Drugs','steady'],['LUMENT','Lumen Therapeutics','turn'],['ZENFRM','Zenith Formulations','decline']]]
];
const QP={
 rocket:{g0:.01,g1:.17,pw:1.3,m0:.08,m1:.20,fx:.07},
 steady:{g0:.03,g1:.03,pw:1,m0:.16,m1:.18,fx:.08},
 choppy:{g0:.012,g1:.012,pw:1,m0:.14,m1:.14,fx:.07},
 basing:{g0:.005,g1:-.004,pw:1,m0:.13,m1:.11,fx:.06},
 decline:{g0:-.005,g1:-.025,pw:1,m0:.15,m1:.09,fx:.05},
 turn:{g0:-.005,g1:.07,pw:1.5,m0:.05,m1:.15,fx:.12}
};
function genStock(sym,name,sector,prof){
  const r=mulberry32(hash(sym)), g=()=>gauss(r), ph=6+r()*8;
  const bars=[]; let p=prof==='rocket'?130+r()*60:80+r()*1400; const vb=2e5*(1+r()*10);
  for(let i=0;i<N;i++){
    const t=i/N; let mu,sg;
    switch(prof){
      case 'rocket': mu=t<.35?.0003:t<.82?.0034:.0018; sg=.021;break;
      case 'steady': mu=.0008; sg=.013;break;
      case 'choppy': mu=.0001+Math.sin(i/40)*.001; sg=.016;break;
      case 'basing': mu=t<.5?-.0007:.0004; sg=.014;break;
      case 'decline': mu=-.0008; sg=.016;break;
      default: mu=t<.6?-.0009:.0030; sg=.019;
    }
    mu+=Math.sin(i/(ph*1.7))*.0014;
    const o=p*(1+g()*sg*.25), c=o*Math.exp(mu+g()*sg);
    const h=Math.max(o,c)*(1+Math.abs(g())*sg*.45), l=Math.min(o,c)*(1-Math.abs(g())*sg*.45);

      if(B[i].l<ns){up=false;ns=ep;ep=B[i].l;af=step}else if(B[i].h>ep){ep=B[i].h;af=Math.min(af+step,top)}}
    else{ns=Math.max(ns,B[i-1].h,B[i-2].h);
      if(B[i].h>ns){up=true;ns=ep;ep=B[i].h;af=step}else if(B[i].l<ep){ep=B[i].l;af=Math.min(af+step,top)}}
    sar=ns;v[i]=sar;d[i]=up?1:-1;
  }
  return {v,d};
}
/* series: style 'line' (default) | 'dash' | 'hist' | 'dots' | 'trend'; off = colour offset from the indicator's own
   colour; fixed = 'up' | 'down' for series that always use the up / down colour; dir = +1/-1 per bar */
const IND={
  sma:{name:'SMA',params:[['Period',50,1,500]],title:p=>'SMA '+p[0],
    calc:(B,[n])=>[{v:smaN(B.map(b=>b.c),n),off:0}]},
  ema:{name:'EMA',params:[['Period',20,1,500]],title:p=>'EMA '+p[0],
    calc:(B,[n])=>[{v:emaS(B.map(b=>b.c),n),off:0}]},
  bb:{name:'Bollinger Bands',params:[['Period',20,2,200],['Std dev',2,.5,5]],title:p=>`BB ${p[0]}, ${p[1]}`,
    calc:(B,[n,k])=>{const C=B.map(b=>b.c),m=smaN(C,n),u=nulls(C.length),l=nulls(C.length);
      for(let i=n-1;i<C.length;i++){let q=0;for(let j=i-n+1;j<=i;j++)q+=(C[j]-m[i])**2;const sd=Math.sqrt(q/n);u[i]=m[i]+k*sd;l[i]=m[i]-k*sd}
      return [{v:u,off:0},{v:m,off:0,style:'dash'},{v:l,off:0}]}},
  st:{name:'Supertrend',params:[['ATR period',10,1,100],['Multiplier',3,.5,10]],title:p=>`Supertrend ${p[0]}, ${p[1]}`,
    calc:(B,[n,m])=>{const r=supertrend(B,n,m);return [{v:r.v,dir:r.d,style:'trend'}]}},
  sar:{name:'Parabolic SAR',params:[['Step',.02,.005,.5],['Max',.2,.05,1]],title:p=>`SAR ${p[0]}, ${p[1]}`,
    calc:(B,[s,m])=>{const r=psar(B,s,m);return [{v:r.v,dir:r.d,style:'dots'}]}},
  rsi:{name:'RSI',pane:true,params:[['Period',14,2,100]],title:p=>'RSI '+p[0],levels:[30,70],range:[0,100],
    calc:(B,[n])=>{const C=B.map(b=>b.c),G=rmaS(C.map((c,i)=>i?Math.max(c-C[i-1],0):null),n),L=rmaS(C.map((c,i)=>i?Math.max(C[i-1]-c,0):null),n);
      return [{v:G.map((x,i)=>nz(x)&&nz(L[i])?(L[i]===0?100:100-100/(1+x/L[i])):null),off:0}]}},
  macd:{name:'MACD',pane:true,params:[['Fast',12,2,100],['Slow',26,2,200],['Signal',9,2,100]],title:p=>`MACD ${p[0]}, ${p[1]}, ${p[2]}`,levels:[0],
    calc:(B,[f,s,g])=>{const C=B.map(b=>b.c),m=diff(emaS(C,f),emaS(C,s)),sg=emaS(m,g);
      return [{v:diff(m,sg),style:'hist'},{v:m,off:0},{v:sg,off:1}]}},
  stoch:{name:'Stochastic',pane:true,params:[['%K',14,2,100],['Smooth',3,1,20],['%D',3,1,20]],title:p=>`Stoch ${p[0]}, ${p[1]}, ${p[2]}`,levels:[20,80],range:[0,100],
    calc:(B,[k,sm,d])=>{const hh=rollExt(B.map(b=>b.h),k,Math.max),ll=rollExt(B.map(b=>b.l),k,Math.min),
      raw=B.map((b,i)=>nz(hh[i])&&hh[i]>ll[i]?(b.c-ll[i])/(hh[i]-ll[i])*100:null),K=sm>1?smaN(raw,sm):raw;
      return [{v:K,off:0},{v:smaN(K,d),off:1}]}},
  atr:{name:'ATR',pane:true,params:[['Period',14,1,100]],title:p=>'ATR '+p[0],
    calc:(B,[n])=>[{v:rmaS(trueRange(B),n),off:0}]},
  adx:{name:'ADX / DMI',pane:true,params:[['Period',14,2,100]],title:p=>'ADX '+p[0],levels:[25],
    calc:(B,[n])=>{const N=B.length,tr=trueRange(B),pd=nulls(N),md=nulls(N);
      for(let i=1;i<N;i++){const u=B[i].h-B[i-1].h,d=B[i-1].l-B[i].l;pd[i]=u>d&&u>0?u:0;md[i]=d>u&&d>0?d:0}
      const a=rmaS(tr,n),P=rmaS(pd,n),M=rmaS(md,n),pi=P.map((x,i)=>nz(x)&&a[i]?100*x/a[i]:null),mi=M.map((x,i)=>nz(x)&&a[i]?100*x/a[i]:null),
        dx=pi.map((x,i)=>nz(x)&&nz(mi[i])&&x+mi[i]>0?100*Math.abs(x-mi[i])/(x+mi[i]):null);
      return [{v:rmaS(dx,n),off:0},{v:pi,fixed:'up'},{v:mi,fixed:'down'}]}}
};
/* colour tokens used by indicator series: a hex colour, or one of the theme's names */
const tok=t=>t==null?null:t==='ink'?col('--ink'):t==='up'?col('--up'):t==='down'?col('--down'):t==='amber'?col('--amber'):t==='muted'?col('--muted'):t;
Object.assign(IND,{
  ribbon:{name:'MA ribbon',params:[['EMA 1',10,1,500],['EMA 2',21,1,500],['SMA 3',50,1,500],['SMA 4',200,1,500]],title:p=>'MA ribbon '+p.join(', '),
    calc:(B,[a,b,c,d])=>{const C=B.map(x=>x.c);return [{v:emaS(C,a),color:'ink'},{v:emaS(C,b),color:'#f59f00'},{v:smaN(C,c),color:'#17a2b8'},{v:smaN(C,d),color:'#d62828'}]}},
  stagema:{name:'Stage analysis',params:[['MA length',150,20,400],['Slope bars',22,5,100]],title:p=>`Stage MA ${p[0]}`,
    calc:(B,[n,k])=>{const C=B.map(x=>x.c),m=smaN(C,n);
      const pc=B.map((b,i)=>{if(!nz(m[i])||i<k||!nz(m[i-k]))return null;const rising=m[i]>m[i-k],above=b.c>m[i];return above&&rising?'up':!above&&!rising?'down':!above?'amber':'muted'});
      return [{v:m,pc,color:'muted'}]}},     // green: stage 2, red: stage 4, amber: stage 3, grey: stage 1
  pocket:{name:'Pocket pivot',params:[['Lookback',10,3,30]],title:p=>'Pocket pivot '+p[0],help:'An up day in an uptrend (above the 50-day average, within 8% of the 10-day) whose volume beats the biggest down-day volume of the last N sessions.',
    calc:(B,[n])=>{const v=nulls(B.length),C=B.map(b=>b.c),s10=smaN(C,10),s50=smaN(C,50);
      for(let i=Math.max(n,1);i<B.length;i++){if(!(B[i].c>B[i-1].c)||!nz(s50[i])||B[i].c<s50[i]||B[i].c<s10[i]*.98||B[i].c>s10[i]*1.08)continue;let mx=0;
        for(let j=i-n;j<i;j++)if(j>=1&&B[j].c<B[j-1].c)mx=Math.max(mx,B[j].v);
        if(mx>0&&B[i].v>mx)v[i]=B[i].l}
      return [{v,style:'mark',color:'up'}]}},     // an up day whose volume beats the biggest down-day volume of the last N sessions
  rvol:{name:'Relative volume',pane:true,params:[['Average over',50,5,250]],title:p=>'RVol '+p[0],levels:[100],
    calc:(B,[n])=>{const V=B.map(b=>b.v),m=smaN(V,n);return [{v:V.map((x,i)=>nz(m[i])&&m[i]>0?x/m[i]*100:null),off:0}]}},
});
const IDXH={map:null,loading:false,dates:null};
function loadIndex(){
  if(IDXH.map||IDXH.loading)return;IDXH.loading=true;
  fetch('/api/history/NIFTY500').then(r=>r.json()).then(j=>{
    IDXH.dates=j.bars.map(a=>a[0]);IDXH.map=new Map(j.bars.map(a=>[a[0],a[4]]));indCache.clear();syncDD();draw();
  }).catch(()=>{IDXH.loading=false});
}
/* the stock's close divided by the Nifty 500's close (the index carried forward over days it did not trade) */
function ratioSeries(B){
  if(!IDXH.map){loadIndex();return null}
  let last=null;const out=B.map(b=>{const v=IDXH.map.get(b.d);if(v!=null)last=v;return last?b.c/last:null});
  return out;
}
Object.assign(IND,{
  rsline:{name:'RS line vs Nifty 500',pane:true,params:[['Average over',50,2,250]],title:p=>'RS line '+p[0],levels:[100],
    calc:(B,[n])=>{const r=ratioSeries(B);if(!r)return [{v:nulls(B.length),off:0}];
      const end=[...r].reverse().find(nz)||1,v=r.map(x=>nz(x)?x/end*100:null);        // scaled so today's value is 100
      return [{v,off:0},{v:smaN(v,n),off:1,style:'dash'}]}},
  mansfield:{name:'Mansfield RS',pane:true,params:[['Average over',252,20,500]],title:p=>'Mansfield RS '+p[0],levels:[0],
    calc:(B,[n])=>{const r=ratioSeries(B);if(!r)return [{v:nulls(B.length),off:0}];const m=smaN(r,n);
      return [{v:r.map((x,i)=>nz(x)&&nz(m[i])?(x/m[i]-1)*100:null),off:0}]}},
});
const IND_DEFAULT=()=>[{id:1,k:'ema',p:[50],c:0,on:true},{id:2,k:'ema',p:[200],c:1,on:true}];

const indCache=new Map();
/* the active indicators computed over `all` (the bars at the current interval); memoised by stock, interval and settings */
function indCalc(all){
  const out=[];
  for(const e of st.ind){
    if(!e.on)continue;const D=IND[e.k],key=[cur.sym,st.iv,all.length,all[all.length-1].c,e.k,e.p.join()].join('|');
    let ser=indCache.get(key);if(!ser){if(indCache.size>200)indCache.clear();ser=D.calc(all,e.p);indCache.set(key,ser)}
    out.push({e,D,title:D.title(e.p),series:ser});
  }
  return out;
}
function serColor(e,s){return s.color&&s.color!=='stage'?tok(s.color):s.fixed==='up'?col('--up'):s.fixed==='down'?col('--down'):s.style==='hist'?col('--muted'):palCol(e.c+(s.off||0))}
/* legend text for the indicators, at bar i */
function indLegend(ind,i){
  const by=new Map(ind.map(x=>[x.e,x]));
  return st.ind.map(e=>{
    const D=IND[e.k],x=by.get(e),on=!!x,head=`<span style="color:${palCol(e.c)}">${esc(D.title(e.p))}</span>`;
    const vals=!x?'':x.series.map(sr=>{
      if(sr.style==='mark')return '';
      const v=sr.v[i];if(!nz(v))return '';
      const sc=sr.dir?(sr.dir[i]===1?col('--up'):col('--down')):sr.pc&&sr.pc[i]?tok(sr.pc[i]):serColor(e,sr);
      return `<span style="color:${sc}">${nf2.format(v)}</span>`}).filter(Boolean).join(' ');
    return `<div class="ir${on?'':' off'}" data-id="${e.id}">${head} ${vals}<span class="ia"><button data-ia="eye" title="${on?'Hide':'Show'}">${on?'◉':'○'}</button><button data-ia="set" title="Indicator settings">⚙</button><button data-ia="rm" title="Remove">✕</button></span></div>`}).join('');
}

async function liveBar(){
  if(!cur||!cur.bars||!cur.bars.length)return;
  const sym=cur.sym;let j;try{const r=await fetch('/api/live/'+encodeURIComponent(sym));j=r.ok?await r.json():null}catch(e){return}
  if(!j||!j.d||!cur||cur.sym!==sym)return;
  const B=cur.bars,last=B[B.length-1];
  if(j.d<last.d||(j.d===last.d&&!last.live))return;                       // the stored bar for that day is the official one
  const k50=2/51,k200=2/201,pe50=B.length>1&&B[B.length-1].live?B[B.length-2].e50:last.e50,pe200=B.length>1&&B[B.length-1].live?B[B.length-2].e200:last.e200;
  const nb={d:j.d,o:j.o,h:j.h,l:j.l,c:j.c,v:j.v,live:true,e50:pe50!=null?pe50+(j.c-pe50)*k50:null,e200:pe200!=null?pe200+(j.c-pe200)*k200:null};
  let prev;
  if(j.d===last.d){B[B.length-1]=nb;prev=B.length>1?B[B.length-2].c:j.prev_close}else{B.push(nb);prev=last.c}
  const a=cur.a;if(prev){a.prev=prev;a.chg=(j.c/prev-1)*100}a.last=j.c;a.vol=j.v;if(a.hi!=null){a.hi=Math.max(a.hi,j.h);a.fromHigh=(a.last/a.hi-1)*100}

function dragger(el,key,sign,min,max){
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}const x0=e.clientX,w0=ui[key];document.body.classList.add('rzing');
    const mv=ev=>{ui[key]=Math.round(clamp(w0+sign*(ev.clientX-x0),min,Math.min(max,innerWidth*.6)));applyUI()};
    const up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);document.body.classList.remove('rzing');saveUI()};
    el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);
  });
  el.addEventListener('dblclick',()=>{ui[key]=UI_DEF[key];applyUI();saveUI()});
}

/* the whole price history, fetched once per stock and kept by the server; the chart shows it all under "Max" */
async function loadHistory(s){
  if(!s||s.histDone)return;
  s.histDone=true;
  try{
    const r=await fetch('/api/history/'+encodeURIComponent(s.sym));if(!r.ok)return;
    const j=await r.json(),lastD=s.bars[s.bars.length-1].d,A=(j.bars||[]).filter(a=>a[0]<=lastD);      // same last session as the rest of the page
    if(A.length<=s.bars.length||A[A.length-1][0]<s.bars[s.bars.length-1].d)return;      // not longer, or older at the end: keep what we have
    const B=A.map(a=>({d:a[0],o:a[1],h:a[2],l:a[3],c:a[4],v:a[5]})),C=B.map(b=>b.c),e50=ema(C,50),e200=ema(C,200);
    B.forEach((b,i)=>{b.e50=e50[i];b.e200=e200[i]});
    s.bars=B;
    if(cur===s){st.vis=memVis();syncDD();draw();renderTable()}
  }catch(e){}
}

/* ---------- market tone: the breadth dashboard's colour for the latest session ---------- */
async function loadTone(){
  try{
    const r=await fetch('/api/breadth/mbi?kind=sma&thr=4&sessions=3');if(!r.ok)return;const D=await r.json(),i=D.dates.length-1,pc=i>0?1:0;
    const box=(v,hi,lo)=>v==null?'':v>hi?'g':v<lo?'r':'';
    const c=[box(D.r4[i],200,50),box(D.r4_chg[i],20,-20),box(D.r20[i],75,50),box(D.r20_chg[i],20,-20),box(D.r50[i],85,60),box(D.r50_chg[i],20,-20)];
    const g=c.filter(x=>x==='g').length,rd=c.filter(x=>x==='r').length,day=g-rd>=3?'g':rd-g>=3?'r':rd>=3?'w':'n';
    const el=$('#tone'),fm=v=>v==null?'–':Math.abs(v)>=1000?nf0.format(v):nf1.format(v);
    el.className='tone '+day;el.hidden=false;
    el.innerHTML=`<i></i>${{g:'Green day',r:'Red day',w:'Warning day',n:'Neutral day'}[day]}`;
    el.title=`Breadth on ${D.dates[i]}${D.live?` (live, as of ${D.live.asof.slice(11,16)} IST)`:''}: 4R ${fm(D.r4[i])} · 20R ${fm(D.r20[i])} · 50R ${fm(D.r50[i])} · ${g} green and ${rd} red cells of 6. Click for the breadth page.`;
    
  }catch(e){}
}
